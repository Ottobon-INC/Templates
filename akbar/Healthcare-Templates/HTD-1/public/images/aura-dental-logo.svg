<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="auraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="toothGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#019FE6" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2F5DFF" />
    </linearGradient>
    <linearGradient id="innerShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#019FE6" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="120" height="120" rx="26" fill="url(#auraBg)" />

  <!-- Outer Aura Ring Glow -->
  <circle cx="60" cy="60" r="46" fill="none" stroke="#019FE6" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="4 3" />

  <!-- Modern Stylized Tooth Icon -->
  <g filter="url(#softShadow)">
    <path d="M60 25 C45 25 34 33 34 46 C34 58 39 70 45 83 C47 87 52 87 54 82 C56 77 58 68 60 68 C62 68 64 77 66 82 C68 87 73 87 75 83 C81 70 86 58 86 46 C86 33 75 25 60 25 Z" fill="url(#toothGrad)" />
    
    <!-- Top-left dimensional gloss -->
    <path d="M44 34 C48 30 54 28 60 28 C66 28 72 30 75 34 C67 31 53 33 47 43 C44 48 43 55 42 61 C40 51 40 40 44 34 Z" fill="url(#innerShine)" />

    <!-- Center Aura core -->
    <ellipse cx="60" cy="50" rx="7" ry="9" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Four-point star sparkle -->
  <g transform="translate(86, 26)">
    <path d="M0 -9 Q0 0 9 0 Q0 0 0 9 Q0 0 -9 0 Q0 0 0 -9 Z" fill="#019FE6" />
    <circle cx="0" cy="0" r="2" fill="#ffffff" />
  </g>
  <circle cx="28" cy="30" r="2.5" fill="#38BDF8" />
  <circle cx="94" cy="74" r="2" fill="#2F5DFF" opacity="0.7" />
</svg>
