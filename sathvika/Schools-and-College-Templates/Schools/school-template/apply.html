<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply Now - Brightwood International School</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .apply-page {
      padding: 100px 0;
      background-color: var(--gray-light);
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .apply-card {
      background: var(--white);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 500px;
    }
    .apply-card h2 {
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--navy);
      font-size: 0.9rem;
    }
    .form-control {
      width: 100%;
      padding: 12px 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.3s;
    }
    .form-control:focus {
      border-color: var(--yellow);
    }
    .btn-full {
      width: 100%;
      justify-content: center;
      padding: 15px;
      font-size: 1rem;
    }
  </style>
</head>
<body>
  
  <!-- Header -->
  <header class="header">
    <div class="container header-container">
      <a href="/index.html" class="logo">
        <div class="logo-icon-wrap">B</div>
        <div class="logo-text">
          <strong>BRIGHTWOOD</strong>
          <span>INTERNATIONAL SCHOOL</span>
        </div>
      </a>
      <nav class="main-nav">
        <ul class="nav-links">
          <li><a href="/index.html">HOME</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Application Form -->
  <section class="apply-page">
    <div class="container" style="display: flex; justify-content: center;">
      <div class="apply-card">
        <h2>Student Application</h2>
        <p class="text-center" style="margin-bottom: 30px; font-size: 0.9rem;">Fill out the form below and our admissions team will contact you shortly.</p>
        
        <form onsubmit="event.preventDefault(); alert('Application submitted successfully!'); window.location.href='/index.html';">
          <div class="form-group">
            <label for="name">Parent/Guardian Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your full name" required>
          </div>
          
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
          </div>
          
          <div class="form-group">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-control" placeholder="Enter your phone number" required>
          </div>
          
          <button type="submit" class="btn btn-yellow btn-full">APPLY NOW <i data-lucide="arrow-right"></i></button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" style="padding-top: 40px;">
    <div class="container footer-bottom">
      <p>&copy; 2024 Brightwood International School. All Rights Reserved.</p>
    </div>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
