<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointments - XYZ Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="main-nav">
        <div class="container nav-inner">
          <div class="logo">
            <a href="/">
              <i class="fas fa-plus-square"></i>
              <span>XYZ Hospital</span>
            </a>
          </div>
          <ul class="nav-links">
            <li><a href="#">Patient Care & Health Info</a></li>
            <li><a href="#">Departments & Centers</a></li>
            <li><a href="#">Research</a></li>
            <li><a href="#">Education</a></li>
            <li><a href="#">For Medical Professionals</a></li>
          </ul>
        </div>
      </nav>
    </header>

    <section class="section bg-light" style="padding-top: 8rem; min-height: 60vh;">
      <div class="container">
        <div class="section-header text-center">
          <h2>Request an Appointment</h2>
          <p>Fill out the form below to schedule an in-person or virtual visit.</p>
        </div>
        <div style="max-width: 600px; margin: 2rem auto; background: var(--color-white); padding: 2.5rem; border-radius: 8px; box-shadow: var(--shadow-md);">
          <form onsubmit="event.preventDefault(); alert('Appointment requested successfully!'); window.location.href='/';">
            <div style="margin-bottom: 1.5rem;">
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Full Name</label>
              <input type="text" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" />
            </div>
            <div style="margin-bottom: 1.5rem;">
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Phone Number</label>
              <input type="tel" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" />
            </div>
            <div style="margin-bottom: 1.5rem;">
              <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Department</label>
              <select style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
                <option>Cardiology</option>
                <option>Neurology</option>
                <option>Orthopedics</option>
                <option>General Practice</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Request</button>
          </form>
        </div>
      </div>
    </section>

    <footer class="footer" style="padding: 2rem 0; text-align: center;">
      <div class="container">
        <p>&copy; 2026 XYZ Hospital. All rights reserved.</p>
      </div>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
