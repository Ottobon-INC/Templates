<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal Login - XYZ Hospital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="header">
      <nav class="main-nav">
        <div class="container nav-inner">
          <div class="logo">
            <a href="/">
              <i class="fas fa-plus-square"></i>
              <span>XYZ Hospital</span>
            </a>
          </div>
          <ul class="nav-links">
            <li><a href="/patient-care.html">Patient Care & Health Info</a></li>
            <li><a href="/departments.html">Departments & Centers</a></li>
            <li><a href="/research.html">Research</a></li>
            <li><a href="/education.html">Education</a></li>
            <li><a href="/professionals.html">For Medical Professionals</a></li>
          </ul>
          <div class="nav-cta">
            <a href="/appointments.html" class="btn btn-secondary">Request Appointment</a>
          </div>
        </div>
      </nav>
    </header>

    <section class="section bg-light" style="padding-top: 8rem; min-height: 80vh; display: flex; align-items: center; justify-content: center;">
      <div style="background: var(--color-white); padding: 3rem; border-radius: 12px; box-shadow: var(--shadow-lg); width: 100%; max-width: 400px; text-align: center;">
        <i class="fas fa-user-circle" style="font-size: 4rem; color: var(--color-primary); margin-bottom: 1rem;"></i>
        <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color: var(--color-text-gray); margin-bottom: 2rem; font-size: 0.9rem;">Sign in to your provider portal</p>
        
        <form onsubmit="event.preventDefault(); alert('Logged in successfully!'); window.location.href='/';">
          <div style="margin-bottom: 1.5rem; text-align: left;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Email Address</label>
            <input type="email" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" placeholder="doctor@xyzhospital.com" />
          </div>
          <div style="margin-bottom: 1.5rem; text-align: left;">
            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem;">Password</label>
            <input type="password" required style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;" placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
        </form>
        <p style="margin-top: 1.5rem; font-size: 0.85rem;"><a href="#" style="color: var(--color-secondary);">Forgot your password?</a></p>
      </div>
    </section>

    <footer class="footer" style="padding: 2rem 0; text-align: center;">
      <div class="container">
        <p>&copy; 2026 XYZ Hospital. All rights reserved.</p>
      </div>
    </footer>
    <script type="module" src="/main.js"></script>
  </body>
</html>
