# ==============================================================================
# Ottobon Templates Hub — Docker Compose Configuration
# For Ubuntu Linux VPS Server Deployment (Production Multi-Container Environment)
# ==============================================================================

services:
  templates-hub:
    build:
      context: .
      dockerfile: Dockerfile
    image: ottobon-templates:latest
    container_name: ottobon-templates
    restart: unless-stopped
    ports:
      # Maps external host port 9600 to internal application port 3000
      - "${HOST_PORT:-9600}:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
    networks:
      - ottobon-net
    # Log rotation to prevent filling up VPS disk
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Safe resource limits for multi-tenant VPS
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  ottobon-net:
    driver: bridge
